appId: com.bubbl.mobile.dev
---
# Deferred flow: requires deterministic seeded clinician credentials before promotion.
# Keep outside mobile/maestro/flows active discovery until fixture/env wiring is stable.
- launchApp
- assertVisible:
    text: Welcome to Bubbl
- tapOn:
    id: launch-clinician-button
- tapOn:
    id: clinician-login-email-input
- inputText: ${CLINICIAN_EMAIL}
- tapOn:
    id: clinician-login-password-input
- inputText: ${CLINICIAN_PASSWORD}
- tapOn:
    id: clinician-login-submit-button
- assertVisible:
    text: Today
- tapOn:
    id: tab-clinician-intake
- assertVisible:
    id: clinician-intake-search-input
- assertVisible:
    text: Search by patient, phone, or status
