appId: com.bubbl.mobile.dev
---
## Patient session restore + post-completion latest result detail + sign out.
- launchApp:
    clearState: true
- assertVisible:
    text: Welcome to Bubbl
- tapOn:
    id: launch-patient-button
- tapOn:
    id: patient-auth-identifier-input
- inputText: ${USER_EMAIL}
- tapOn:
    id: patient-auth-password-input
- inputText: ${USER_PASSWORD}
- tapOn:
    id: patient-auth-continue-button
- assertVisible:
    text: Active check-ins
- assertVisible:
    id: patient-home-active-checkin-${E2E_PATIENT_IN_PROGRESS_SCREENING_ID}
- launchApp:
    clearState: false
- assertVisible:
    text: Active check-ins
- assertVisible:
    id: patient-home-active-checkin-${E2E_PATIENT_IN_PROGRESS_SCREENING_ID}
- assertVisible:
    id: patient-home-latest-result-row
- tapOn:
    id: patient-home-latest-result-row
- assertVisible:
    id: patient-screening-detail-root
- assertVisible:
    text: Check-in complete
- tapOn:
    id: tab-patient-timeline
- assertVisible:
    id: patient-timeline-row-${E2E_PATIENT_COMPLETED_SCREENING_ID}
- tapOn:
    id: patient-timeline-row-${E2E_PATIENT_COMPLETED_SCREENING_ID}
- assertVisible:
    id: patient-screening-detail-root
- tapOn:
    id: tab-patient-profile
- tapOn:
    id: sign-out-button
- assertVisible:
    text: Welcome to Bubbl
