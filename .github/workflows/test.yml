name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-static-checks:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      NEXT_PUBLIC_APP_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  mobile-maestro-smoke:
    # Maestro smoke runs only on push to main or manual dispatch — never on PRs.
    # Kept non-blocking until emulator/device stability is proven.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    continue-on-error: true
    env:
      NODE_ENV: development
      NEXT_PUBLIC_APP_ENV: local
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.MOBILE_E2E_API_BASE_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.MOBILE_E2E_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MOBILE_E2E_SUPABASE_ANON_KEY }}
      USER_EMAIL: ${{ secrets.MOBILE_E2E_USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.MOBILE_E2E_USER_PASSWORD }}
      CLINICIAN_EMAIL: ${{ secrets.MOBILE_E2E_CLINICIAN_EMAIL }}
      CLINICIAN_PASSWORD: ${{ secrets.MOBILE_E2E_CLINICIAN_PASSWORD }}
    steps:
      - name: Gate Maestro smoke on required mobile E2E secrets
        id: gate
        run: |
          set -euo pipefail
          missing=()
          required_vars=(EXPO_PUBLIC_API_BASE_URL EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY USER_EMAIL USER_PASSWORD CLINICIAN_EMAIL CLINICIAN_PASSWORD)
          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              missing+=("$var_name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Maestro smoke skipped"
              echo "- Missing env/secrets: ${missing[*]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/checkout@v4
      - if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - if: ${{ steps.gate.outputs.run == 'true' }}
        run: npm ci
      - if: ${{ steps.gate.outputs.run == 'true' }}
        name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - if: ${{ steps.gate.outputs.run == 'true' }}
        name: Boot iOS simulator
        run: |
          set -euo pipefail
          DEVICE_UDID="$(xcrun simctl create "bubbl-e2e" "iPhone 15" || xcrun simctl list devices available | awk -F'[()]' '/iPhone 15/ {print $2; exit}')"
          echo "SIM_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
      - if: ${{ steps.gate.outputs.run == 'true' }}
        name: Build & install Expo dev client (com.bubbl.mobile.dev)
        env:
          MOBILE_DEV_CLIENT_APP_PATH: ${{ secrets.MOBILE_DEV_CLIENT_APP_PATH }}
        run: |
          set -euo pipefail
          if [[ -n "${MOBILE_DEV_CLIENT_APP_PATH:-}" && -d "$MOBILE_DEV_CLIENT_APP_PATH" ]]; then
            xcrun simctl install "$SIM_UDID" "$MOBILE_DEV_CLIENT_APP_PATH"
          else
            npx expo prebuild --platform ios --no-install --clean
            npx expo run:ios --device "$SIM_UDID" --no-bundler &
            EXPO_BUILD_PID=$!
            for i in $(seq 1 120); do
              if xcrun simctl get_app_container "$SIM_UDID" com.bubbl.mobile.dev >/dev/null 2>&1; then
                break
              fi
              sleep 5
            done
            kill "$EXPO_BUILD_PID" 2>/dev/null || true
          fi
          xcrun simctl get_app_container "$SIM_UDID" com.bubbl.mobile.dev
      - if: ${{ steps.gate.outputs.run == 'true' }}
        name: Start Metro bundler
        run: |
          npx expo start --dev-client --port 8081 > metro.log 2>&1 &
          echo "METRO_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
      - if: ${{ steps.gate.outputs.run == 'true' }}
        run: npm run e2e:doctor
      - if: ${{ steps.gate.outputs.run == 'true' }}
        run: npm run test:e2e:mobile:smoke
      - if: ${{ always() && steps.gate.outputs.run == 'true' }}
        name: Stop Metro bundler
        run: kill "${METRO_PID:-}" 2>/dev/null || true
      - if: ${{ failure() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-mobile
          path: |
            ~/.maestro/tests
            metro.log
